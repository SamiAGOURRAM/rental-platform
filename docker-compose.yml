services:
  postgres:
    image: postgres:15-alpine
    container_name: rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_platform
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental_user -d rental_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rental_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  app:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: rental_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rental_user:rental_password@postgres:5432/rental_platform
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./packages/backend/.env

volumes:
  pgdata:
  redisdata:
